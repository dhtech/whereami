# An example: nginx logs the visitor in and tells whereami who it is
# and where it came from. whereami believes these two headers - nginx
# must SET them (never pass on what a client sent), and whereami must
# be reachable through nginx only.
#
# The name must resolve to an IPv4 address ONLY: whereami finds a
# visitor by the DHCP lease of the IPv4 address it came from. For the
# IPv6 check, give the same server a second name with only an AAAA
# record (below: v6.whereami.example.net) and set
#   WHEREAMI_IPV6_OWN_URL=https://v6.whereami.example.net/ipv6
server {
  listen 443 ssl;
  server_name whereami.example.net;
  # ssl_certificate ...; ssl_certificate_key ...;

  location / {
    auth_basic           "whereami";          # or auth_pam, auth_request, ...
    auth_basic_user_file /etc/nginx/whereami.htpasswd;
    proxy_pass       http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
  # the lookup is a stream of events: hand each on as it comes
  location = /stream {
    auth_basic           "whereami";
    auth_basic_user_file /etc/nginx/whereami.htpasswd;
    proxy_pass       http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering  off;
    proxy_read_timeout 120s;
  }
}

# the IPv6-only name: nothing but "what is my address", no login
server {
  listen [::]:443 ssl;
  server_name v6.whereami.example.net;
  # ssl_certificate ...; ssl_certificate_key ...;

  location = /ipv6 {
    proxy_pass       http://127.0.0.1:8000;
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { return 404; }
}
